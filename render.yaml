# Render Blueprint: PayBridge API plus Vite frontend
services:
  - type: web
    name: paybridge-api
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PAYBRIDGE_PASSWORD_A1_TRADER
        sync: false
      - key: PAYBRIDGE_PASSWORD_A1_APPROVER
        sync: false
      - key: PAYBRIDGE_PASSWORD_B1_TRADER
        sync: false
      - key: PAYBRIDGE_PASSWORD_B1_APPROVER
        sync: false
      - key: PAYBRIDGE_PASSWORD_REGA
        sync: false
      - key: PAYBRIDGE_PASSWORD_REGB
        sync: false
      - key: PAYBRIDGE_PASSWORD_AUDITOR
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PUBLIC_APP_URL
        value: https://paypal-hackathon-061h.onrender.com
      - key: FABRIC_GATEWAY_ENABLED
        value: "true"
      - key: FABRIC_GATEWAY_WRITE_ENABLED
        value: "true"
      - key: FABRIC_HOST
        sync: false
      - key: FABRIC_TLS_SERVER_NAME
        value: peer0.banka1.consortium.local
      - key: FABRIC_MSP_ID
        value: BankA1MSP
      - key: FABRIC_CHANNEL
        value: settlement
      - key: FABRIC_CHAINCODE
        value: settlement-cc
      - key: FABRIC_PEER_PORT
        value: "9051"
      - key: FABRIC_USER_CERT_BASE64
        sync: false
      - key: FABRIC_USER_KEY_BASE64
        sync: false
      - key: FABRIC_BANKA1_CERT_BASE64
        sync: false
      - key: FABRIC_BANKA1_KEY_BASE64
        sync: false
      - key: FABRIC_BANKB1_CERT_BASE64
        sync: false
      - key: FABRIC_BANKB1_KEY_BASE64
        sync: false
      - key: FABRIC_TLS_CA_BASE64
        sync: false
      - key: FABRIC_WRITE_API_TOKEN
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  - type: web
    name: paybridge-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: paybridge-api
          property: host
