# Render Infrastructure as Code (Prototype Blueprint - Not Production)
services:
  # PayBridge AI Express API Backend
  - type: web
    name: paybridge-api
    env: node
    plan: free
    buildCommand: npm install && cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  # PayBridge AI React + Vite Frontend
  - type: web
    name: paybridge-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: paybridge-api
          property: host

  # Autonomous Settlement Background Daemon
  - type: worker
    name: paybridge-settlement-worker
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: node -e "console.log('PayBridge Autonomous Settlement Worker active'); setInterval(() => {}, 60000);"
