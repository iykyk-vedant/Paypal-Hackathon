networks:
  consortium:
    external: true
    name: consortium

services:
  cc.rega:
    container_name: cc.rega
    image: settlement-cc:latest
    restart: always
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CORE_CHAINCODE_ID_NAME=${PACKAGE_ID_REGA}
      - CHAINCODE_ID=${PACKAGE_ID_REGA}
    networks:
      - consortium

  cc.regb:
    container_name: cc.regb
    image: settlement-cc:latest
    restart: always
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9999
      - CORE_CHAINCODE_ID_NAME=${PACKAGE_ID_REGB}
      - CHAINCODE_ID=${PACKAGE_ID_REGB}
