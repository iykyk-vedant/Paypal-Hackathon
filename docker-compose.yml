      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.regb.consortium.local
      - CORE_PEER_ADDRESS=peer0.regb.consortium.local:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.regb.consortium.local:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.regb.consortium.local:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.regb.consortium.local:8051
      - CORE_PEER_GOSSIP_ORGLEADER=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=false
      - CORE_PEER_LOCALMSPID=RegBMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0regb"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ./network/peercfg:/etc/hyperledger/peercfg
      - ./network/organizations/peerOrganizations/regb.consortium.local/peers/peer0.regb.consortium.local:/etc/hyperledger/fabric
      - peer0.regb:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
      - "8051:8051"
    networks:
      consortium:
        aliases:
          - peer0.regb.consortium.local

  peer0.banka1:
    container_name: peer0.banka1
    image: hyperledger/fabric-peer:2.5
    restart: always
