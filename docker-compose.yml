      - CORE_PEER_CHAINCODEADDRESS=peer0.auditor.consortium.local:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.auditor.consortium.local:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.auditor.consortium.local:11051
      - CORE_PEER_GOSSIP_ORGLEADER=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=false
      - CORE_PEER_LOCALMSPID=AuditorMSP
