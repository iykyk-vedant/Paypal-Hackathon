      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bankb1.consortium.local:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankb1.consortium.local:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankb1.consortium.local:10051
      - CORE_PEER_GOSSIP_ORGLEADER=true
