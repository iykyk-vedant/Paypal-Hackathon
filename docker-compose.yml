      - CORE_PEER_ID=peer0.banka1.consortium.local
      - CORE_PEER_ADDRESS=peer0.banka1.consortium.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.banka1.consortium.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.banka1.consortium.local:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.banka1.consortium.local:9051
      - CORE_PEER_GOSSIP_ORGLEADER=true
      - CORE_PEER_GOSSIP_USELEADERELECTION=false
      - CORE_PEER_LOCALMSPID=BankA1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9446
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0banka1"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ./network/peercfg:/etc/hyperledger/peercfg
      - ./network/organizations/peerOrganizations/banka1.consortium.local/peers/peer0.banka1.consortium.local:/etc/hyperledger/fabric
      - peer0.banka1:/var/hyperledger/production
    working_dir: /root
    command: peer node start
    ports:
